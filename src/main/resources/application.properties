quarkus.application.name=service-product
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins[0]=/.*/
quarkus.http.enable-compression=true
quarkus.native.resources.includes=jwt/**,specifications/**,templates/**

#------------------------------------------------------------
# OpenAPI
#------------------------------------------------------------
quarkus.smallrye-openapi.path=/openapi

#------------------------------------------------------------
# JWT
#------------------------------------------------------------
mp.jwt.verify.issuer=https://example.com/issuer
mp.jwt.verify.publickey.location=jwt/public.pem
smallrye.jwt.sign.key.location=jwt/private.key

#------------------------------------------------------------
# upload file configuration
#------------------------------------------------------------
quarkus.http.limits.max-body-size=100M
quarkus.http.limits.max-form-attribute-size=2M

